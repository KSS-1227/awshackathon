[pytest]
# Run from this directory so pytest does NOT traverse the parent `backend`
# package and trigger the heavy ML-pipeline imports (SentenceTransformer, etc.)
# that are irrelevant to these DB constraint smoke tests.
#
# Usage:
#   pytest backend/auth/migrations/smoke_test_constraints.py -v
# or from within this directory:
#   pytest smoke_test_constraints.py -v
testpaths = .
python_files = smoke_test_*.py test_*.py
python_classes = Test*
python_functions = test_*
